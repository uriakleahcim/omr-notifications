[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-notifications"
version = "0.2.1"
description = "Omarchy's local event-policy and notification runtime"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "uriak" }]
dependencies = []

[project.scripts]
omr-notifications = "omr_notifications.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
